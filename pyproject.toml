[project]
name = "graphqlad"
dynamic = ["version"]
description = "Read-only GraphQL interface over the msad Active Directory library"
authors = [
    { name = "Matteo Redaelli", email = "matteo.redaelli@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "strawberry-graphql[fastapi]>=0.240",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "msad>=0.10.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
]

[project.optional-dependencies]
# Kerberos (SASL/GSSAPI) authentication against AD. Needs system Kerberos dev
# headers to build (see msad's README). Skip if you only use user/password.
kerberos = [
    "msad[kerberos]>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/matteoredaelli/graphqlAD"
Issues = "https://github.com/matteoredaelli/graphqlAD/issues"

[project.scripts]
graphqlad = "graphqlad.__main__:main"

[build-system]
requires = ["hatchling >= 1.32", "hatch-vcs"]
build-backend = "hatchling.build"

# Derive the version from Git tags (e.g. tag "v0.5.0" -> version "0.5.0").
# No manual version bump in this file is needed anymore: just create a tag.
[tool.hatch.version]
source = "vcs"

# Write the resolved version to a generated module so it is importable at
# runtime (graphqlad.__version__) without re-inspecting Git.
[tool.hatch.build.hooks.vcs]
version-file = "src/graphqlad/_version.py"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # strawberry 0.336 deprecates passing a class to strawberry.scalar(); the
    # NewType-based custom JSON scalar still works and the suggested
    # scalar_map alternative does not fit a generic JSON-safe scalar.
    "ignore:Passing a class to strawberry.scalar.*:DeprecationWarning",
]
